name: Sala de situacion

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sala
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - run: python monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DURACION_MIN: "50"
          INTERVALO_S: "120"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
      - name: Latido mensual para que GitHub no lo pause
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2500000 ]; then
            date -u > .latido
            git config user.name sala
            git config user.email sala@users.noreply.github.com
            git add .latido && git commit -m latido && git push
          fi
