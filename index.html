<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sala de situación</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0b1416;--panel:#11201f;--line:#21403f;--ink:#e3eeec;--muted:#8fa7a5;--accent:#d9a27c;--hi:#f2867e;--mid:#e0a04a;--ok:#5dcaa5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{margin:0;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.clocks{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.clocks b{font-size:16px;display:block}
.clocks span{font-size:11px;color:var(--muted)}
.state{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}
.layout{display:grid;grid-template-columns:1fr 380px;height:calc(100% - 52px)}
.main{display:grid;grid-template-rows:62% 38%;min-height:0}
.wall{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:6px;padding:6px;min-height:0}
#map{margin:0 6px 6px;border:1px solid var(--line);border-radius:6px;background:#0e1a1c}
.oscuro{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.leaflet-popup-content{font:13px/1.35 -apple-system,system-ui,sans-serif}
.leaflet-popup-content a{color:#8a4a26}
.tile{position:relative;background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:0}
.tile iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tile select{position:absolute;top:6px;left:6px;z-index:2;background:rgba(11,20,22,.85);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font:inherit;font-size:12px}
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side h2{margin:0;padding:10px 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.side h2 button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:4px;font:inherit;font-size:11px;padding:2px 6px;cursor:pointer}
.feed{flex:1;overflow-y:auto;padding:6px 8px}
.alert{border-left:3px solid var(--muted);background:var(--panel);border-radius:4px;padding:7px 9px;margin-bottom:6px}
.alert.p4,.alert.p5{border-left-color:var(--hi)}
.alert.p3{border-left-color:var(--mid)}
.alert .t{font-weight:600}
.alert .m{color:var(--muted);font-size:13px}
.alert .w{font-size:11px;color:var(--muted);margin-top:3px}
.alert a{color:var(--accent)}
.alert.new{animation:flash 2.5s ease-out}
@keyframes flash{from{background:#3a2a1e}to{background:var(--panel)}}
.setup{padding:14px;color:var(--muted)}
.setup input{width:100%;padding:8px;margin:8px 0;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:4px;font:inherit}
.setup button{padding:8px 12px;background:var(--accent);border:0;border-radius:4px;font:inherit;font-weight:600;cursor:pointer}
.extra{border-top:1px solid var(--line);height:42%;display:flex;flex-direction:column}
.extra .panel{flex:1;min-height:0}
.extra iframe{width:100%;height:100%;border:0}
.tabs2 button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:4px;font:inherit;font-size:11px;padding:2px 6px;margin-left:4px;cursor:pointer}
.tabs2 button.on{color:var(--ink);border-color:var(--accent)}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;height:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--panel);border-top:1px solid var(--line);z-index:1000}
.tabbar button{position:relative;flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.tabbar button.on{color:var(--accent)}
.tabbar .ic{font-size:19px;line-height:1}
.tabbar .n{position:absolute;top:5px;left:56%;background:var(--hi);color:#111;border-radius:9px;font-size:10px;font-weight:700;padding:0 5px}
.tabbar .n[hidden]{display:none}
@media (max-width:900px){
  html,body{height:100%;overflow:hidden}
  header{padding:6px 10px;gap:10px;flex-wrap:nowrap;height:46px}
  h1{font-size:13px;white-space:nowrap}
  .clocks{overflow-x:auto;gap:10px;scrollbar-width:none}
  .clocks b{font-size:13px}
  #stxt{display:none}
  .layout{display:block;height:calc(100% - 46px - 58px - env(safe-area-inset-bottom,0px));overflow:hidden}
  .main,.side{display:contents}
  .wall,#map,.side>h2,.feed,.extra{display:none}
  body[data-tab=tv] .wall{display:grid;grid-template-columns:1fr;grid-auto-rows:auto;align-content:start;padding:0;gap:0}
  body[data-tab=tv] .tile{aspect-ratio:16/9;border-radius:0;border:0}
  body[data-tab=mapa] #map{display:block;height:100%;margin:0;border:0;border-radius:0}
  body[data-tab=alertas] .side>h2{display:flex}
  body[data-tab=alertas] .feed{display:block;height:calc(100% - 41px)}
  body[data-tab=ind] .extra{display:flex;height:100%;border-top:0}
  .tile select{font-size:14px;padding:6px 8px}
  .tabbar{display:flex}
}
</style>
</head>
<body>
<header>
  <h1>Sala de situación</h1>
  <div class="clocks" id="clocks"></div>
  <div class="state"><span class="dot" id="dot"></span><span id="stxt">Desconectado</span></div>
</header>
<div class="layout">
  <div class="main">
    <section class="wall" id="wall" aria-label="Canales en directo"></section>
    <div id="map" aria-label="Mapa de incidencias"></div>
  </div>
  <aside class="side">
    <h2>Alertas en directo <button id="reset" type="button" title="Cambiar canal de alertas">Canal</button></h2>
    <div class="feed" id="feed"></div>
    <div class="extra">
      <h2><span>Indicadores</span><span class="tabs2"><button type="button" data-p="mercados" class="on">Mercados</button><button type="button" data-p="cripto">Cripto</button><button type="button" data-p="meteo">Radar meteo</button></span></h2>
      <div id="p-mercados" class="panel"></div>
      <div id="p-cripto" class="panel" hidden></div>
      <div id="p-meteo" class="panel" hidden></div>
    </div>
  </aside>
</div>
<nav class="tabbar" aria-label="Secciones">
  <button type="button" data-t="alertas" class="on"><span class="ic">🔔</span>Alertas<span class="n" hidden></span></button>
  <button type="button" data-t="mapa"><span class="ic">🗺️</span>Mapa</button>
  <button type="button" data-t="tv"><span class="ic">📺</span>TV</button>
  <button type="button" data-t="ind"><span class="ic">📈</span>Indicadores</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
"use strict";
// Canales con emisión gratuita y continua en YouTube (cambiables en cada pantalla)
const CHANNELS=[
  ["Sky News (Reino Unido)","UCoMdktPbSTixAyNGwb-UYkQ"],
  ["Al Jazeera English","UCNye-wNBqNL5ZzHSJj3l8Bg"],
  ["France 24 Español","UCUdOoVWuWmgo1wByzcsyKDQ"],
  ["France 24 English","UCQfwfsi5VrQ8yKZ-UWmAEFg"],
  ["DW News","UCknLrEdhRCp1aegoMqRaCZg"],
  ["DW Español","UCT4Jg8h03dD0iN3Pb5L0PMA"],
  ["Euronews English","UCSrZ3UV4jOidv8ppoVuvW9Q"],
  ["ABC News (EEUU)","UCBi2mrWuNuyYy4gbM6fU18Q"],
  ["NBC News (EEUU)","UCeY0bbntWzzVIaj2z3QigXg"],
  ["Bloomberg","UCIALMKvObZNtJ6AmdCLP7Lg"]
];
const DEFAULT=[0,2,7,1];
const MOBILE=matchMedia("(max-width:900px)").matches;
const $=id=>document.getElementById(id);
const store={get:k=>{try{return JSON.parse(localStorage.getItem("sala:"+k));}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem("sala:"+k,JSON.stringify(v));}catch(e){}}};

// ---------- relojes ----------
function clocks(){
  const z=[["Madrid","Europe/Madrid"],["Londres","Europe/London"],["Nueva York","America/New_York"],["CDMX","America/Mexico_City"]];
  $("clocks").innerHTML=z.map(([n,tz])=>`<div><b>${new Intl.DateTimeFormat("es-ES",{hour:"2-digit",minute:"2-digit",timeZone:tz}).format(new Date())}</b><span>${n}</span></div>`).join("");
}
clocks(); setInterval(clocks,20000);

// ---------- muro de vídeo ----------
const slots=store.get("slots")||DEFAULT;
function tile(i){
  const t=document.createElement("div"); t.className="tile";
  const sel=document.createElement("select");
  CHANNELS.forEach(([n],k)=>{const o=document.createElement("option");o.value=k;o.textContent=n;sel.append(o);});
  sel.value=slots[i];
  const f=document.createElement("iframe");
  f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen=true;
  const load=()=>{ f.src=`https://www.youtube.com/embed/live_stream?channel=${CHANNELS[sel.value][1]}&autoplay=1&mute=1`; };
  sel.onchange=()=>{slots[i]=Number(sel.value); store.set("slots",slots); load();};
  load(); t.append(f,sel); if(i===0) window._tv={f,load}; return t;
}
slots.forEach((_,i)=>{ if(MOBILE&&i>0) return; $("wall").append(tile(i)); });

// ---------- alertas en directo (ntfy) ----------
let es=null, seen=new Set();
function setState(on,txt){$("dot").className="dot"+(on?" on":"");$("stxt").textContent=txt;}
function ago(s){const m=Math.round((Date.now()/1000-s)/60); if(m<1)return "ahora"; if(m<60)return `hace ${m} min`; return new Intl.DateTimeFormat("es-ES",{hour:"2-digit",minute:"2-digit"}).format(new Date(s*1000));}
function add(m,fresh){
  if(m.event!=="message"||seen.has(m.id)) return; seen.add(m.id);
  if(fresh&&MOBILE&&tab!=="alertas"){ nuevas++; badge(); }
  if(/venezuel|caracas|maduro|chavis/i.test((m.title||"")+" "+(m.message||""))) return;
  const d=document.createElement("div"); d.className="alert p"+(m.priority||3)+(fresh?" new":""); d.dataset.time=m.time;
  const t=document.createElement("div"); t.className="t"; t.textContent=m.title||m.message;
  const x=document.createElement("div"); x.className="m"; x.textContent=m.title?m.message:"";
  const w=document.createElement("div"); w.className="w"; w.textContent=ago(m.time);
  d.append(t,x,w);
  if(m.click){const a=document.createElement("a");a.href=m.click;a.target="_blank";a.rel="noopener";a.textContent=" Abrir ↗";w.append(a);}
  const feed=$("feed");
  const after=[...feed.children].find(c=>Number(c.dataset.time)<m.time);
  feed.insertBefore(d,after||null);
  while(feed.children.length>150) feed.lastChild.remove();
}
function setup(){
  $("feed").innerHTML=`<div class="setup">Escribe el nombre de tu canal de alertas (el mismo que usas en ntfy). Solo se guarda en este navegador.<input id="topic" placeholder="alertas-…" autocomplete="off"><button id="go" type="button">Conectar</button></div>`;
  $("go").onclick=()=>{const v=$("topic").value.trim(); if(v){store.set("topic",v); connect();}};
}
async function connect(){
  const topic=store.get("topic"); if(!topic){setup();return;}
  $("feed").innerHTML=""; seen=new Set();
  try{
    const r=await fetch(`https://ntfy.sh/${encodeURIComponent(topic)}/json?poll=1&since=12h`);
    const txt=await r.text();
    txt.trim().split("\n").filter(Boolean).map(l=>{try{return JSON.parse(l);}catch(e){return null;}}).filter(Boolean).forEach(m=>add(m,false));
  }catch(e){}
  if(es) es.close();
  es=new EventSource(`https://ntfy.sh/${encodeURIComponent(topic)}/sse`);
  es.onopen=()=>setState(true,"Alertas en directo");
  es.onerror=()=>setState(false,"Reconectando…");
  es.onmessage=e=>{try{add(JSON.parse(e.data),true);}catch(x){}};
  conectarMapa(topic);
}
setInterval(()=>document.querySelectorAll(".alert .w").forEach(w=>{const t=Number(w.parentNode.dataset.time); if(t){const a=w.querySelector("a"); w.firstChild&&w.firstChild.nodeType===3?w.firstChild.nodeValue=ago(t):w.prepend(document.createTextNode(ago(t)));}}),60000);
// ---------- mapa de incidencias ----------
let mapa=null, capa=null, esMapa=null, puntos=new Set();
const COLOR={4:"#f2867e",5:"#f2867e",3:"#e0a04a",2:"#8fa7a5"};
function iniciarMapa(){
  if(mapa||!window.L) return;
  mapa=L.map("map",{worldCopyJump:true}).setView([40,-20],2);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,className:"oscuro",attribution:'&copy; OpenStreetMap'}).addTo(mapa);
  capa=L.layerGroup().addTo(mapa);
}
function punto(m){
  if(m.event!=="message"||puntos.has(m.id)) return; puntos.add(m.id);
  let d; try{d=JSON.parse(m.message);}catch(e){return;}
  if(typeof d.lat!=="number") return;
  const edad=(Date.now()/1000-m.time)/3600;
  const c=L.circleMarker([d.lat,d.lon],{radius:d.p>=4?8:6,color:COLOR[d.p]||"#8fa7a5",fillColor:COLOR[d.p]||"#8fa7a5",fillOpacity:Math.max(.25,.9-edad/30),weight:1});
  const div=document.createElement("div");
  const b=document.createElement("b"); b.textContent=d.t; div.append(b);
  const p=document.createElement("div"); p.textContent=(d.f||"")+", "+ago(m.time); div.append(p);
  if(d.u&&/^https?:/.test(d.u)){const a=document.createElement("a");a.href=d.u;a.target="_blank";a.rel="noopener";a.textContent="Abrir noticia ↗";div.append(a);}
  c.bindPopup(div); capa.addLayer(c);
}
async function conectarMapa(topic){
  iniciarMapa(); if(!mapa) return;
  capa.clearLayers(); puntos=new Set();
  const t=encodeURIComponent(topic+"-mapa");
  try{
    const r=await fetch(`https://ntfy.sh/${t}/json?poll=1&since=24h`);
    (await r.text()).trim().split("\n").filter(Boolean).forEach(l=>{try{punto(JSON.parse(l));}catch(e){}});
  }catch(e){}
  if(esMapa) esMapa.close();
  esMapa=new EventSource(`https://ntfy.sh/${t}/sse`);
  esMapa.onmessage=e=>{try{punto(JSON.parse(e.data));}catch(x){}};
}
// ---------- indicadores ----------
function mercados(){
  const box=$("p-mercados"); if(box.dataset.ok) return; box.dataset.ok="1";
  box.innerHTML='<div class="tradingview-widget-container" style="height:100%"><div class="tradingview-widget-container__widget" style="height:100%"></div></div>';
  const s=document.createElement("script"); s.src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js"; s.async=true;
  s.textContent=JSON.stringify({width:"100%",height:"100%",colorTheme:"dark",isTransparent:true,locale:"es",showSymbolLogo:false,
    symbolsGroups:[{name:"Riesgo y mercados",symbols:[{name:"CAPITALCOM:VIX",displayName:"VIX (miedo)"},{name:"TVC:UKOIL",displayName:"Brent"},{name:"TVC:GOLD",displayName:"Oro"},{name:"FX:EURUSD",displayName:"EUR/USD"},{name:"FX_IDC:USDMXN",displayName:"USD/MXN"},{name:"BME:IBC",displayName:"IBEX 35"},{name:"FOREXCOM:SPXUSD",displayName:"S&P 500"}]}]});
  box.firstChild.append(s);
}
function cripto(){
  const box=$("p-cripto"); if(box.dataset.ok) return; box.dataset.ok="1";
  box.innerHTML='<div class="tradingview-widget-container" style="height:100%"><div class="tradingview-widget-container__widget" style="height:100%"></div></div>';
  const s=document.createElement("script"); s.src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js"; s.async=true;
  s.textContent=JSON.stringify({width:"100%",height:"100%",colorTheme:"dark",isTransparent:true,locale:"es",showSymbolLogo:true,
    symbolsGroups:[{name:"Criptomonedas",symbols:[{name:"BITSTAMP:BTCEUR",displayName:"Bitcoin (EUR)"},{name:"BINANCE:BTCUSDT",displayName:"Bitcoin (USD)"},{name:"BINANCE:ETHUSDT",displayName:"Ethereum"},{name:"BINANCE:SOLUSDT",displayName:"Solana"},{name:"BINANCE:XRPUSDT",displayName:"XRP"},{name:"BINANCE:BNBUSDT",displayName:"BNB"},{name:"BINANCE:DOGEUSDT",displayName:"Dogecoin"},{name:"BINANCE:ADAUSDT",displayName:"Cardano"}]}]});
  box.firstChild.append(s);
}
function meteo(){
  const box=$("p-meteo"); if(box.dataset.ok) return; box.dataset.ok="1";
  box.innerHTML='<iframe title="Radar meteorológico" src="https://embed.windy.com/embed2.html?lat=40.4&lon=-3.7&zoom=5&level=surface&overlay=radar&menu=&message=true&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=km%2Fh&metricTemp=%C2%B0C&radarRange=-1"></iframe>';
}
const PANELES={mercados,cripto,meteo};
document.querySelectorAll(".tabs2 button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs2 button").forEach(x=>x.classList.toggle("on",x===b)); const p=b.dataset.p; Object.keys(PANELES).forEach(k=>$("p-"+k).hidden=k!==p); PANELES[p]();});
mercados();
$("reset").onclick=()=>{store.set("topic",null); if(es) es.close(); if(esMapa) esMapa.close(); setState(false,"Desconectado"); setup();};
// ---------- pestañas en el móvil ----------
let tab="alertas", nuevas=0;
function badge(){ const s=document.querySelector('.tabbar [data-t="alertas"] .n'); if(s){ s.textContent=nuevas>99?"99+":String(nuevas); s.hidden=!nuevas; } }
function setTab(t){
  tab=t; document.body.dataset.tab=t;
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  if(window._tv){ if(t==="tv") window._tv.load(); else window._tv.f.src="about:blank"; }
  if(t==="mapa"&&mapa) setTimeout(()=>mapa.invalidateSize(),60);
  if(t==="alertas"){ nuevas=0; badge(); }
}
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
if(MOBILE) setTab("alertas");
window.addEventListener("load",()=>{ iniciarMapa(); connect(); });
})();
</script>
</body>
</html>
