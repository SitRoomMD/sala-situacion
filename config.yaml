# Zonas, fuentes y filtros de la sala de situación. Se puede editar con el lápiz.
max_alertas_por_ciclo: 15

excluir_siempre: [horóscopo, lotería, quiniela, simulacro]

# Zonas para sismos: [oeste, sur, este, norte]
zonas:
  espana: [-18.5, 27.4, 4.6, 44.0]
  mexico: [-118.5, 14.3, -86.5, 32.8]

fuentes:
  - nombre: Madrid, sucesos y emergencias
    lector: google_news
    tipo: emergencias
    query: 'Madrid (incendio OR explosión OR tiroteo OR apuñalado OR evacuación OR derrumbe OR apagón OR "corte de luz" OR atropello OR "última hora")'

  - nombre: España, alertas graves
    lector: google_news
    tipo: emergencias
    query: 'España (atentado OR explosión OR apagón OR evacuación OR "alerta roja" OR DANA OR "incendio forestal")'

  - nombre: España, operaciones y procedimientos
    lector: google_news
    tipo: seguridad
    silenciosa: true
    query: '(UCO OR Anticorrupción OR "Audiencia Nacional" OR "concurso de acreedores" OR "registros en la sede") empresa'

  - nombre: México, solo lo grave
    lector: google_news
    tipo: emergencias
    query: '(México OR CDMX) (atentado OR "coche bomba" OR masacre OR "toque de queda" OR "estado de emergencia" OR "alerta sísmica" OR terremoto OR huracán OR "aeropuerto cerrado" OR magnicidio OR "ataque con drones")'
    hl: es-419
    gl: MX

  - nombre: Europa Press
    lector: rss
    tipo: noticias
    url: https://www.europapress.es/rss/rss.aspx
    incluir: ["última hora", muere, muertos, herido, incendio, explosión, evacu, atentado, apagón, derrumbe]

  - nombre: Sismos en España (y M6,5+ en el mundo)
    lector: emsc
    tipo: sismos
    url: https://www.seismicportal.eu/fdsnws/event/1/query?format=json&limit=40&minmag=3
    zonas: [espana]
    magnitud_minima: 3.5
    magnitud_fuera_de_zona: 6.5

  - nombre: Sismos fuertes en México (M5,5+)
    lector: usgs
    tipo: sismos
    url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_hour.geojson
    zonas: [mexico]
    magnitud_minima: 5.5

  - nombre: GDACS, catástrofes naranja y roja
    lector: rss
    tipo: catastrofes
    url: https://www.gdacs.org/xml/rss.xml
    incluir: [orange, red]

  - nombre: Meteoalarm, avisos naranja y rojo
    lector: rss
    tipo: meteo
    url: https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-spain
    incluir: [orange, red, naranja, rojo]

  - nombre: Europa, última hora
    lector: google_news
    tipo: noticias
    query: '(Europa OR UE OR Francia OR Alemania OR Italia OR Bruselas) ("última hora" OR atentado OR explosión OR ataque OR evacuación OR "estado de emergencia" OR tiroteo)'

  - nombre: Reino Unido, última hora
    lector: google_news
    tipo: noticias
    query: '(UK OR London OR England) ("major incident" OR attack OR explosion OR evacuation OR stabbing OR "terror" OR "breaking news")'
    hl: en-GB
    gl: GB

  - nombre: EEUU, última hora
    lector: google_news
    tipo: noticias
    query: '("Estados Unidos" OR EEUU OR Washington OR "Nueva York") ("última hora" OR atentado OR tiroteo OR explosión OR evacuación OR "estado de emergencia")'

  - nombre: Atentados en el mundo
    lector: google_news
    tipo: seguridad
    query: '(atentado OR "ataque terrorista" OR "atentado terrorista" OR "coche bomba" OR "ataque yihadista")'

  - nombre: Amenazas de bomba y desalojos
    lector: google_news
    tipo: seguridad
    query: '("amenaza de bomba" OR "aviso de bomba" OR "artefacto explosivo" OR "paquete sospechoso" OR "desalojo por amenaza" OR TEDAX)'

  - nombre: Catástrofes en el mundo
    lector: google_news
    tipo: catastrofes
    query: '(terremoto OR tsunami OR huracán OR tifón OR erupción OR inundaciones OR "incendio forestal") (muertos OR víctimas OR evacuados OR desaparecidos)'

  - nombre: Elecciones en España
    lector: google_news
    tipo: noticias
    silenciosa: true
    query: '(elecciones OR comicios OR "adelanto electoral" OR "convocatoria electoral" OR "disolución de las Cortes" OR "elecciones autonómicas" OR "elecciones generales") España'
    window: 2h

  - nombre: Drones, incidentes en España y Europa
    lector: google_news
    tipo: drones
    query: '(dron OR drones) (aeropuerto OR "espacio aéreo" OR avistamiento OR ataque OR derribado OR "base militar" OR "infraestructura crítica" OR "central nuclear" OR incursión OR "cierre del aeropuerto")'

  - nombre: Drones, incidentes en el mundo
    lector: google_news
    tipo: drones
    query: '(drone OR drones) (airport OR airspace OR sighting OR attack OR "shot down" OR "military base" OR incursion OR "critical infrastructure")'
    hl: en-GB
    gl: GB

  # Canal público de Telegram: pon el nombre de t.me/NOMBRE y cambia activa a true
  - nombre: Canal de Telegram
    lector: telegram
    tipo: telegram
    channel: NOMBRE_DEL_CANAL
    activa: false
